name: Gentoo Overlay QA (pkgcheck)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    container:
      image: gentoo/stage3:amd64-nomultilib-openrc
    steps:
      - name: Checkout Overlay
        uses: actions/checkout@v4

      - name: Install pkgcheck (via Gentoo Binhost) & Scan Overlay
        run: |
          emerge-webrsync -q
          mkdir -p /etc/portage/binrepos.conf
          cat << 'BIN' > /etc/portage/binrepos.conf/gentoobinhost.conf
          [binhost]
          priority = 9999
          sync-uri = https://gentoo.org
          BIN
          FEATURES="getbinpkg" emerge -q --getbinpkg dev-util/pkgcheck
          pkgcheck scan --repo . --exit error
