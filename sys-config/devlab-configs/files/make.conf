COMMON_NAME="DevLab"

VVV="0.0.1"

COMMON_FLAGS="-march=znver5 -O3 -pipe"

RUSTFLAGS="${RUSTFLAGS} -C target-cpu=znver5"

CFLAGS="${COMMON_FLAGS}"

CXXFLAGS="${COMMON_FLAGS}"

FCFLAGS="${COMMON_FLAGS}"

FFLAGS="${COMMON_FLAGS}"

CPU_FLAGS_X86="aes avx avx2 avx512_bf16 avx512_bitalg avx512_vbmi2 avx512_vnni avx512_vp2intersect avx512_vpopcntdq avx512bw avx512cd avx512dq avx512f avx512ifma avx512vbmi avx512vl avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"

FEATURES="binpkg-docompress binpkg-dostrip merge-sync multilib-strict sandbox sfperms xattr unmerge-orphans distlocks ebuild-locks fakeroot compress-build-logs fixlafiles parallel-install parallel-fetch buildpkg compress-index metadata-transfer binpkg-multi-instance "

LC_MESSAGES="C.UTF-8"

PKGDIR="/var/cache/binpkgs/${COMMON_NAME}/${VVV}"

BINPKG_COMPRESS="zstd"

BINPKG_COMPRESS_FLAGS="-9"

PYTHON_TARGETS="python3_12 python3_13 python3_14 python3_15" 

RUBY_TARGETS="ruby33 ruby34 ruby40"

LUA_SINGLE_TARGET="lua5-4"

GUILE_SINGLE_TARGET="2-2"

RUST_SYSROOTS="bpf wasm"

USE="multilib lz4 lzo opencl gstreamer rar uasm idn stunnel -audit -webengine -telepathy egl gles2 sndfile twolame wavpack -xen kdesu amr ao id3tag lto pgo rust go jit ladspa ibus kms libsamplerate pkcs11 bpf dvb ivorbis gbm aacs openexr duktape bdplus libvirt nvml rocm java lua valgrind opencl caps openal vaapi vdpau appstream sdk modules python modules-compress pipewire sound-server alsa bluetooth dbus mesa nvenc nvdec amf opengl openal vulkan dvd alsa acl cdr X wayland vdpau virgl v4l vaapi custom-cflags dist-kernel zstd "

PORTAGE_NICENESS="-19"

PORTAGE_IONICE_COMMAND="ionice -c 2 -p \${PID}"

ACCEPT_LICENSE="*"

ACCEPT_KEYWORDS="amd64 ~amd64"

L10N="en en-US"

#full tilt
MAKEOPTS="-j26 -l28"
#half tilt for gaming while compile
#MAKEOPTS="-j14 -l16"

LINGUAS="en en_US"

INPUT_DEVICES="libinput evdev joystick elographics synaptics vmmouse void wacom "

VIDEO_CARDS="amdgpu radeonsi nvidia d3d12 i915 intel nouveau nvk r300 r600 radeon virgl vmware zink fbdev qxl vesa "

LLVM_TARGETS="X86 AMDGPU NVPTX DirectX RISCV SPIRV Xtensa BPF WebAssembly AArch64 ARM AVR M68k  "

QEMU_SOFTMMU_TARGETS="i386 x86_64 aarch64 arm riscv32 riscv64 avr m68k xtensa xtensaeb "

QEMU_USER_TARGETS="i386 x86_64 aarch64 aarch64_be arm armeb riscv32 riscv64 m68k xtensa xtensaeb "

GRUB_PLATFORMS="efi-32 efi-64 pc qemu coreboot emu "


